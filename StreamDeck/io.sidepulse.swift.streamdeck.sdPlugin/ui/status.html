<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent Status</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    padding: 8px 12px 12px 0;
    background: #2d2d2d;
    color: #d8d8d8;
    font: 9pt -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }
  .item { display: flex; align-items: center; min-height: 30px; margin-bottom: 4px; }
  .item > label:first-child, .item > .label {
    flex: 0 0 96px;
    padding: 0 10px 0 16px;
    box-sizing: border-box;
    color: #969696;
  }
  select {
    flex: 1;
    min-width: 0;
    height: 26px;
    padding: 0 6px;
    border: 0;
    border-radius: 3px;
    background: #3d3d3d;
    color: #d8d8d8;
    font: inherit;
  }
  .check { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .check input { margin: 0; accent-color: #0a84ff; }
  .help { margin: 10px 0 0 16px; color: #969696; line-height: 1.45; }
  .help a { color: #5ab0ff; text-decoration: none; cursor: pointer; }
</style>
</head>
<body>
  <div class="item">
    <label for="provider">Agents</label>
    <select id="provider">
      <option value="all">All agents</option>
      <option value="claude">Claude Code</option>
      <option value="codex">Codex</option>
      <option value="opencode">OpenCode</option>
    </select>
  </div>
  <div class="item">
    <span class="label">Animation</span>
    <label class="check"><input type="checkbox" id="animate"> Animate Working and Ask</label>
  </div>
  <p class="help">
    Shows the agent that most needs you. Press the key to open SidePulse settings.
    Needs the SidePulse Swift app: <a id="download">download it</a>.
  </p>
<script>
  "use strict";
  const downloadURL = "https://github.com/khromov/sidepulse-swift/releases/latest";
  let socket = null;
  let context = null;
  let settings = {};

  function show() {
    document.getElementById("provider").value = settings.provider || "all";
    document.getElementById("animate").checked = settings.animate !== false;
  }

  function send(message) {
    if (socket && socket.readyState === WebSocket.OPEN) socket.send(JSON.stringify(message));
  }

  function save() {
    settings.provider = document.getElementById("provider").value;
    settings.animate = document.getElementById("animate").checked;
    send({ event: "setSettings", context, payload: settings });
  }

  // Stream Deck calls this global once the page loads.
  window.connectElgatoStreamDeckSocket = (port, uuid, registerEvent, info, actionInfo) => {
    context = uuid;
    try { settings = JSON.parse(actionInfo).payload.settings || {}; } catch { settings = {}; }
    show();
    socket = new WebSocket("ws://127.0.0.1:" + port);
    socket.onopen = () => send({ event: registerEvent, uuid });
    socket.onmessage = (message) => {
      const data = JSON.parse(message.data);
      if (data.event === "didReceiveSettings") {
        settings = data.payload.settings || {};
        show();
      }
    };
  };

  document.getElementById("provider").addEventListener("change", save);
  document.getElementById("animate").addEventListener("change", save);
  document.getElementById("download").addEventListener("click", () => {
    send({ event: "openUrl", payload: { url: downloadURL } });
  });
</script>
</body>
</html>
